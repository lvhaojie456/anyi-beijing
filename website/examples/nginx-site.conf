server {
    listen 80;
    server_name anyi.anyibj.cn;
    root /var/www/anyi-memorial-site;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://api.anyibj.cn data:; style-src 'self'; script-src 'none'; connect-src https://api.anyibj.cn; form-action 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
