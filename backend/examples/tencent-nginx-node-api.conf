server {
    listen 80;
    server_name api.anyibj.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.anyibj.cn;

    ssl_certificate /etc/letsencrypt/live/api.anyibj.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.anyibj.cn/privkey.pem;

    client_max_body_size 60m;

    location /downloads/ {
        alias /var/www/anyi-downloads/;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
    }

    # The retired virtual-human web frontend remains unreachable. New /ai/*
    # API requests are handled by the main backend through the proxy below.
    location = /vtuber { return 404; }
    location /vtuber/ { return 404; }
    location = /client-ws { return 404; }
    location = /proxy-ws { return 404; }
    location = /tts-ws { return 404; }
    location = /asr { return 404; }
    location /live2d-models/ { return 404; }
    location /bg/ { return 404; }
    location /avatars/ { return 404; }
    location /cache/ { return 404; }
    location /web-tool/ { return 404; }
    location /web_tool/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/api.anyibj.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.anyibj.cn/privkey.pem;

    return 444;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
