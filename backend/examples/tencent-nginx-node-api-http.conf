server {
    listen 80 default_server;
    server_name api.anyibj.cn anyibj.cn _;

    # Never preserve caller-supplied client IP headers if proxying is added here.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";

    return 301 https://api.anyibj.cn$request_uri;
}
