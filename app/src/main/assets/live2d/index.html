<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; media-src 'none'; object-src 'none'">
<title>Live2D</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:transparent; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="runtime/live2dcubismcore.min.js"></script>
<script src="runtime/pixi.min.js"></script>
<script src="runtime/cubism4.min.js"></script>
<script>
// Bridge contract with Kotlin (Live2dAvatarView):
//   Kotlin -> JS : window.anyiLive2d.load(modelId)      load a bundled model
//                  window.anyiLive2d.speak(text)         nod + talk animation
//                  window.anyiLive2d.idle()              return to idle
//                  window.anyiLive2d.setLipSync(0..1)    manual mouth openness
//   JS -> Kotlin : AndroidBridge.onReady(modelId)        model loaded
//                  AndroidBridge.onError(message)        load failed
(function () {
  const canvas = document.getElementById('c');
  const app = new PIXI.Application({
    view: canvas, autoStart: true, resizeTo: window,
    backgroundAlpha: 0, antialias: true, resolution: Math.min(window.devicePixelRatio || 1, 2), autoDensity: true
  });
  let model = null;
  let talkTimer = null;
  let lipTarget = 0;
  let loadSequence = 0;
  let generatedBounds = null;

  function bridge(fn, arg) {
    try { if (window.AndroidBridge && window.AndroidBridge[fn]) window.AndroidBridge[fn](arg == null ? '' : String(arg)); } catch (e) {}
  }

  function fit() {
    if (!model) return;
    const pw = app.renderer.width / app.renderer.resolution;
    const ph = app.renderer.height / app.renderer.resolution;
    const im = model.internalModel;
    const ow = im.originalWidth || im.width || 1, oh = im.originalHeight || im.height || 1;
    if (generatedBounds) {
      const [x1,y1,x2,y2] = generatedBounds;
      const scale = Math.min(pw / (x2-x1), ph / (y2-y1)) * 0.91;
      model.scale.set(scale);
      model.anchor.set(0,0);
      model.position.set(pw/2-(x1+x2)/2*scale, ph/2-(y1+y2)/2*scale);
      return;
    }
    const scale = Math.min(pw / ow, ph / oh) * 0.98;
    model.scale.set(scale);
    model.anchor.set(0.5, 0.42);
    model.position.set(pw / 2, ph * 0.46);
  }
  window.addEventListener('resize', fit);

  function setParam(id, v) {
    try {
      const core = model && model.internalModel && model.internalModel.coreModel;
      if (core && typeof core.setParameterValueById === 'function') core.setParameterValueById(id, v);
    } catch (e) {}
  }

  // Simple lip-sync: drive ParamMouthOpenY every frame toward lipTarget.
  app.ticker.add(() => {
    if (!model) return;
    setParam('ParamMouthOpenY', lipTarget);
  });

  async function load(modelId, generatedUrl) {
    const id = String(modelId || '');
    if (!id) { bridge('onError', 'empty model id'); return; }
    const entry = MODEL_FILES[id];
    const generated = /^generated:[a-f0-9-]{36}$/.test(id);
    const expected = location.origin + '/generated-live2d/' + id.slice(10) + '/runtime/model.model3.json';
    if (!entry && !(generated && generatedUrl === expected)) { bridge('onError', 'unknown model'); return; }
    const sequence = ++loadSequence;
    stopTalk();
    if (model) { app.stage.removeChild(model); model.destroy(); model = null; }
    try {
      let bounds = null;
      if (generated) {
        const response = await fetch(generatedUrl);
        if (!response.ok) throw new Error('model unavailable');
        const document = await response.json();
        const b = document.AnyiBounds;
        if (Array.isArray(b) && b.length===4 && b.every(Number.isFinite) && b[2]>b[0] && b[3]>b[1]) bounds=b;
      }
      const next = await PIXI.live2d.Live2DModel.from(generated ? generatedUrl : 'models/' + id + '/' + entry, { autoInteract: true });
      if (sequence !== loadSequence) { next.destroy(); return; }
      model = next;
      generatedBounds = bounds;
      if (generated) {
        const im = model.internalModel, core = im.coreModel;
        const visible = [];
        for (let i=0; i<core.getDrawableCount(); i++) {
          if (core.getDrawableOpacity(i) <= 0) continue;
          const b=im.getDrawableBounds(i);
          if (b.width>0 && b.height>0) visible.push(b);
        }
        if (visible.length) generatedBounds=[
          Math.min(...visible.map(b=>b.x)), Math.min(...visible.map(b=>b.y)),
          Math.max(...visible.map(b=>b.x+b.width)), Math.max(...visible.map(b=>b.y+b.height))
        ];
      }
      app.stage.addChild(model);
      fit();
      try { model.motion('Idle'); } catch (e) {}
      bridge('onReady', id);
    } catch (e) {
      if (sequence !== loadSequence) return;
      bridge('onError', String(e && e.message ? e.message : e));
    }
  }

  function stopTalk() {
    if (talkTimer) { clearInterval(talkTimer); talkTimer = null; }
    lipTarget = 0;
  }

  // Text-driven talk animation: no audio yet, so approximate mouth motion
  // from text length. Real audio lip-sync replaces this once TTS lands.
  function speak(text) {
    if (!model) return;
    stopTalk();
    const chars = Math.max(1, String(text || '').length);
    const durationMs = Math.min(9000, 600 + chars * 110);
    const start = Date.now();
    try { model.motion('Tap'); } catch (e) {}
    talkTimer = setInterval(() => {
      const t = Date.now() - start;
      if (t >= durationMs) { stopTalk(); return; }
      lipTarget = 0.25 + 0.6 * Math.abs(Math.sin(t / 95)) * (0.6 + 0.4 * Math.random());
    }, 40);
  }

  function idle() { stopTalk(); try { if (model) model.motion('Idle'); } catch (e) {} }
  function setLipSync(v) { lipTarget = Math.max(0, Math.min(1, Number(v) || 0)); }

  const MODEL_FILES = {
    kei:    'kei_basic_free.model3.json',
    izumi:  'izumi_illust.model3.json',
    haru:   'haru_greeter_t05.model3.json',
    hiyori: 'hiyori_pro_t11.model3.json',
    tororo: 'tororo.model3.json',
    hijiki: 'hijiki.model3.json'
  };

  window.anyiLive2d = { load, speak, idle, setLipSync };
  bridge('onPageReady', '');
})();
</script>
</body>
</html>
